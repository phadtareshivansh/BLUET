<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 56" width="900" height="56" role="img" aria-label="Decorative divider with a small bluet flower"><title id="t">Decorative divider</title><desc id="d">A horizontal line with a small bluet flower in the center.</desc><defs><linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6FA8EE" stop-opacity="0"/><stop offset="1" stop-color="#6FA8EE" stop-opacity="1"/></linearGradient><linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6FA8EE" stop-opacity="1"/><stop offset="1" stop-color="#6FA8EE" stop-opacity="0"/></linearGradient><linearGradient id="petal" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#EAF4FF"/><stop offset="1" stop-color="#5FA0EE"/></linearGradient><radialGradient id="core" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#FFF3B0"/><stop offset="1" stop-color="#F3B21B"/></radialGradient><path id="pet" d="M0,-2 C-20,-10 -36,-44 -15,-63 C-9,-68 -3,-63 0,-55 C3,-63 9,-68 15,-63 C36,-44 20,-10 0,-2 Z"/></defs><style>.sway{animation:sway 6s ease-in-out infinite}.heart{animation:heart 2.6s ease-in-out infinite}.tw{animation:twinkle 3s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}@keyframes heart{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="60" y="27" width="340" height="2" rx="1" fill="url(#fadeL)"/><rect x="500" y="27" width="340" height="2" rx="1" fill="url(#fadeR)"/><g fill="#FFD75E"><circle class="tw" cx="410" cy="28" r="2" style="animation-delay:0s"/><circle class="tw" cx="490" cy="28" r="2" style="animation-delay:1s"/><circle class="tw" cx="380" cy="28" r="1.4" style="animation-delay:.5s"/><circle class="tw" cx="520" cy="28" r="1.4" style="animation-delay:1.5s"/></g><g transform="translate(450,28) scale(.36)"><g class="sway"><g fill="url(#petal)" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="1.5"><use href="#pet"/><use href="#pet" transform="rotate(90)"/><use href="#pet" transform="rotate(180)"/><use href="#pet" transform="rotate(270)"/></g><g class="heart"><circle r="11" fill="url(#core)" stroke="#FFFFFF" stroke-width="2"/></g></g></g></svg>
