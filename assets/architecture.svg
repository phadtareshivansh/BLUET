<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d"><title id="t">BLUET architecture</title><desc id="d">Layered architecture: developer interface, orchestration and messaging, specialist agent mesh, local infrastructure and security, and local data and state. Animated dashed lines show how tasks and data flow between layers.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1B3A"/><stop offset="1" stop-color="#18397A"/></linearGradient><path id="pet" d="M0,-2 C-20,-10 -36,-44 -15,-63 C-9,-68 -3,-63 0,-55 C3,-63 9,-68 15,-63 C36,-44 20,-10 0,-2 Z"/><g id="mini"><use href="#pet"/><use href="#pet" transform="rotate(90)"/><use href="#pet" transform="rotate(180)"/><use href="#pet" transform="rotate(270)"/><circle r="12" fill="#F6C945" stroke="#FFFFFF" stroke-width="3"/></g><marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#9CC8FF"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#FFD75E"/></marker><clipPath id="clip"><rect width="1200" height="700" rx="28"/></clipPath></defs><style>text{font-family:"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif}.lay{font-size:12px;font-weight:800;letter-spacing:1.5px}.tag{font-size:9.5px;font-weight:700;letter-spacing:.8px}.nm{font-size:16px;font-weight:700;fill:#FFFFFF}.nms{font-size:14px;font-weight:700;fill:#FFFFFF}.ds{font-size:12px;fill:#BBD3F5}.dss{font-size:11px;fill:#BBD3F5}.lb{font-size:11px;font-weight:600;fill:#DCEBFF}.lbg{font-size:11px;font-weight:700;fill:#FFE58A}.flow{animation:flow 1.4s linear infinite}.sway{animation:sway 7s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-36}}@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g clip-path="url(#clip)"><rect width="1200" height="700" fill="url(#bg)"/><path class="flow" d="M375,138 V222" fill="none" stroke="#7FB2E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#ahB)"/><path class="flow" d="M980,138 V166 H440 V222" fill="none" stroke="#7FB2E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#ahB)"/><path class="flow" d="M915,298 V336 H320 V384" fill="none" stroke="#7FB2E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#ahB)"/><path class="flow" d="M600,336 V384" fill="none" stroke="#7FB2E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#ahB)"/><path class="flow" d="M980,336 V384" fill="none" stroke="#7FB2E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#ahB)"/><path class="flow" d="M320,460 V496 H158 V566" fill="none" stroke="#7FB2E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#ahB)"/><path class="flow" d="M560,460 V510 H190 V566" fill="none" stroke="#7FB2E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#ahB)"/><path class="flow" d="M640,460 V522 H820 V566" fill="none" stroke="#7FB2E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#ahB)"/><path class="flow" d="M1000,460 V566" fill="none" stroke="#7FB2E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#ahB)"/><rect x="30" y="24" width="1140" height="130" rx="18" fill="#FFFFFF" fill-opacity=".04" stroke="#6FA8EE" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="7 6"/><text class="lay" x="50" y="46" fill="#6FA8EE">DEVELOPER INTERFACE LAYER</text><rect x="30" y="190" width="1140" height="120" rx="18" fill="#FFFFFF" fill-opacity=".04" stroke="#8E9BFF" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="7 6"/><text class="lay" x="50" y="212" fill="#8E9BFF">ORCHESTRATION &amp; MESSAGING LAYER</text><rect x="30" y="350" width="1140" height="130" rx="18" fill="#FFFFFF" fill-opacity=".04" stroke="#3FCBBB" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="7 6"/><text class="lay" x="50" y="372" fill="#3FCBBB">SPECIALIST AGENT MESH</text><rect x="30" y="530" width="660" height="140" rx="18" fill="#FFFFFF" fill-opacity=".04" stroke="#4FD68A" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="7 6"/><text class="lay" x="50" y="658" fill="#4FD68A">LOCAL DATA &amp; STATE LAYER</text><rect x="710" y="530" width="460" height="140" rx="18" fill="#FFFFFF" fill-opacity=".04" stroke="#F6C945" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="7 6"/><text class="lay" x="730" y="658" fill="#F6C945">LOCAL INFRASTRUCTURE &amp; SECURITY</text><rect x="50" y="62" width="340" height="76" rx="14" fill="#0F2347" fill-opacity=".92" stroke="#6FA8EE" stroke-opacity=".8" stroke-width="1.5"/><g transform="translate(74,100)"><g class="sway" style="animation-delay:0s"><use href="#mini" fill="#6FA8EE" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="3" transform="scale(.21)"/></g></g><text class="tag" x="96" y="84" fill="#6FA8EE">CLIENT  ·  TYPER + RICH</text><text class="nm" x="96" y="106">BLUET CLI</text><text class="ds" x="96" y="124">Live spinners, colorized AST diffs</text><rect x="430" y="62" width="340" height="76" rx="14" fill="#0F2347" fill-opacity=".92" stroke="#6FA8EE" stroke-opacity=".8" stroke-width="1.5"/><g transform="translate(454,100)"><g class="sway" style="animation-delay:-1.3s"><use href="#mini" fill="#6FA8EE" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="3" transform="scale(.21)"/></g></g><text class="tag" x="476" y="84" fill="#6FA8EE">CLIENT  ·  TYPESCRIPT  ·  LSP CLIENT</text><text class="nm" x="476" y="106">Developer IDE</text><text class="ds" x="476" y="124">VS Code, Cursor, etc. via BLUET extension</text><rect x="810" y="62" width="340" height="76" rx="14" fill="#0F2347" fill-opacity=".92" stroke="#6FA8EE" stroke-opacity=".8" stroke-width="1.5"/><g transform="translate(834,100)"><g class="sway" style="animation-delay:-2.6s"><use href="#mini" fill="#6FA8EE" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="3" transform="scale(.21)"/></g></g><text class="tag" x="856" y="84" fill="#6FA8EE">SERVICE  ·  PYGLS</text><text class="nm" x="856" y="106">BLUET LSP Server</text><text class="ds" x="856" y="124">Side-by-side legacy vs. modern diffs</text><path class="flow" d="M770,100 H810" fill="none" stroke="#7FB2E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#ahB)"/><rect x="50" y="222" width="470" height="76" rx="14" fill="#0F2347" fill-opacity=".92" stroke="#8E9BFF" stroke-opacity=".8" stroke-width="1.5"/><g transform="translate(74,260)"><g class="sway" style="animation-delay:-3.9s"><use href="#mini" fill="#8E9BFF" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="3" transform="scale(.21)"/></g></g><text class="tag" x="96" y="244" fill="#8E9BFF">SERVICE  ·  LANGGRAPH + PYDANTIC-AI</text><text class="nm" x="96" y="266">BLUET Orchestrator</text><text class="ds" x="96" y="284">Stateful cyclic graphs and multi-agent debate state</text><rect x="680" y="222" width="470" height="76" rx="14" fill="#0F2347" fill-opacity=".92" stroke="#8E9BFF" stroke-opacity=".8" stroke-width="1.5"/><g transform="translate(704,260)"><g class="sway" style="animation-delay:-5.2s"><use href="#mini" fill="#8E9BFF" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="3" transform="scale(.21)"/></g></g><text class="tag" x="726" y="244" fill="#8E9BFF">MESSAGE QUEUE  ·  ZEROMQ + ASYNCIO</text><text class="nm" x="726" y="266">Local Event Bus</text><text class="ds" x="726" y="284">Decouples agent execution so nothing blocks the UI</text><path class="flow" d="M520,248 H680" fill="none" stroke="#7FB2E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#ahB)"/><path class="flow" d="M680,274 H520" fill="none" stroke="#7FB2E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#ahB)"/><text class="lb" x="600" y="242" text-anchor="middle">dispatch tasks</text><text class="lb" x="600" y="291" text-anchor="middle">results · events</text><rect x="50" y="384" width="340" height="76" rx="14" fill="#0F2347" fill-opacity=".92" stroke="#3FCBBB" stroke-opacity=".8" stroke-width="1.5"/><g transform="translate(74,422)"><g class="sway" style="animation-delay:-6.5s"><use href="#mini" fill="#3FCBBB" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="3" transform="scale(.21)"/></g></g><text class="tag" x="96" y="406" fill="#3FCBBB">AGENT  ·  TREE-SITTER + ANTLR4</text><text class="nm" x="96" y="428">Analyzer Agent</text><text class="ds" x="96" y="446">Control-flow graphs and state mutations</text><rect x="430" y="384" width="340" height="76" rx="14" fill="#0F2347" fill-opacity=".92" stroke="#3FCBBB" stroke-opacity=".8" stroke-width="1.5"/><g transform="translate(454,422)"><g class="sway" style="animation-delay:-7.8s"><use href="#mini" fill="#3FCBBB" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="3" transform="scale(.21)"/></g></g><text class="tag" x="476" y="406" fill="#3FCBBB">AGENT  ·  PYDANTIC-AI + FORMATTERS</text><text class="nm" x="476" y="428">Refactor Agent</text><text class="ds" x="476" y="446">Synthesizes Go / Rust / TypeScript code</text><rect x="810" y="384" width="340" height="76" rx="14" fill="#0F2347" fill-opacity=".92" stroke="#3FCBBB" stroke-opacity=".8" stroke-width="1.5"/><g transform="translate(834,422)"><g class="sway" style="animation-delay:-9.1s"><use href="#mini" fill="#3FCBBB" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="3" transform="scale(.21)"/></g></g><text class="tag" x="856" y="406" fill="#3FCBBB">AGENT  ·  HYPOTHESIS + FAST-CHECK + Z3</text><text class="nm" x="856" y="428">Verification Agent</text><text class="ds" x="856" y="446">Edge cases and boundary conditions</text><path class="flow" d="M390,410 H430" fill="none" stroke="#7FB2E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#ahB)"/><path class="flow" d="M770,410 H810" fill="none" stroke="#7FB2E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#ahB)"/><path class="flow" d="M810,436 H770" fill="none" stroke="#FFD75E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#ahG)"/><text class="lbg" x="790" y="474" text-anchor="middle">counter-example feedback</text><rect x="50" y="566" width="216" height="76" rx="14" fill="#0F2347" fill-opacity=".92" stroke="#4FD68A" stroke-opacity=".8" stroke-width="1.5"/><g transform="translate(74,604)"><g class="sway" style="animation-delay:-10.4s"><use href="#mini" fill="#4FD68A" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="3" transform="scale(.21)"/></g></g><text class="tag" x="96" y="588" fill="#4FD68A">DATABASE  ·  MOSS</text><text class="nms" x="96" y="610">Moss Context Store</text><text class="dss" x="96" y="628">Hybrid vector + AST search</text><rect x="282" y="566" width="196" height="76" rx="14" fill="#0F2347" fill-opacity=".92" stroke="#4FD68A" stroke-opacity=".8" stroke-width="1.5"/><g transform="translate(306,604)"><g class="sway" style="animation-delay:-11.7s"><use href="#mini" fill="#4FD68A" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="3" transform="scale(.21)"/></g></g><text class="tag" x="328" y="588" fill="#4FD68A">DATABASE  ·  SQLITE</text><text class="nms" x="328" y="610">Workflow State</text><text class="dss" x="328" y="628">Checkpoints + audit trail</text><rect x="494" y="566" width="176" height="76" rx="14" fill="#0F2347" fill-opacity=".92" stroke="#4FD68A" stroke-opacity=".8" stroke-width="1.5"/><g transform="translate(518,604)"><g class="sway" style="animation-delay:-13s"><use href="#mini" fill="#4FD68A" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="3" transform="scale(.21)"/></g></g><text class="tag" x="540" y="588" fill="#4FD68A">STORAGE  ·  GIT + FS</text><text class="nms" x="540" y="610">Local Codebase</text><text class="dss" x="540" y="628">Legacy source repo</text><rect x="730" y="566" width="180" height="76" rx="14" fill="#0F2347" fill-opacity=".92" stroke="#F6C945" stroke-opacity=".8" stroke-width="1.5"/><g transform="translate(754,604)"><g class="sway" style="animation-delay:-14.3s"><use href="#mini" fill="#F6C945" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="3" transform="scale(.21)"/></g></g><text class="tag" x="776" y="588" fill="#F6C945">OLLAMA  ·  VLLM</text><text class="nms" x="776" y="610">Local LLM</text><text class="dss" x="776" y="628">Qwen2.5 · Llama 3.3</text><rect x="930" y="566" width="220" height="76" rx="14" fill="#0F2347" fill-opacity=".92" stroke="#F6C945" stroke-opacity=".8" stroke-width="1.5"/><g transform="translate(954,604)"><g class="sway" style="animation-delay:-15.6s"><use href="#mini" fill="#F6C945" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="3" transform="scale(.21)"/></g></g><text class="tag" x="976" y="588" fill="#F6C945">DOCKER  ·  GVISOR</text><text class="nms" x="976" y="610">Execution Sandbox</text><text class="dss" x="976" y="628">Isolated side-by-side runs</text><text class="lb" x="690" y="161" text-anchor="middle">start jobs · stream status</text><text class="lb" x="600" y="330" text-anchor="middle">task.analysis  ·  task.refactor  ·  task.verify</text><text class="lb" x="240" y="491" text-anchor="middle">index</text><text class="lb" x="450" y="506" text-anchor="middle">semantic search</text><text class="lb" x="730" y="517" text-anchor="middle">structured synthesis</text><text class="lb" x="1008" y="508" text-anchor="start">sandboxed runs</text></g></svg>
