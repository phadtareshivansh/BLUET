<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1125 340" width="1125" height="340" role="img" aria-labelledby="t d"><title id="t">The BLUET pipeline</title><desc id="d">Four bluet flowers connected in a row: Analyze, Synthesize, Verify, and Parity. A gold loop returns from Verify to Synthesize for self-healing.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1B3A"/><stop offset="1" stop-color="#1B3E7C"/></linearGradient><linearGradient id="g1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#F2F8FF"/><stop offset="1" stop-color="#5FA0EE"/></linearGradient><linearGradient id="g2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#F4F2FF"/><stop offset="1" stop-color="#8E9BFF"/></linearGradient><linearGradient id="g3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#EFFFFB"/><stop offset="1" stop-color="#3FCBBB"/></linearGradient><linearGradient id="g4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#F0FFF5"/><stop offset="1" stop-color="#4FD68A"/></linearGradient><radialGradient id="core" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#FFF3B0"/><stop offset="1" stop-color="#F3B21B"/></radialGradient><path id="pet" d="M0,-2 C-20,-10 -36,-44 -15,-63 C-9,-68 -3,-63 0,-55 C3,-63 9,-68 15,-63 C36,-44 20,-10 0,-2 Z"/><marker id="ahBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#9CC8FF"/></marker><marker id="ahGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#FFD75E"/></marker><clipPath id="clip"><rect width="1125" height="340" rx="28"/></clipPath><radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.85" stop-color="#FFFFFF" stop-opacity="0.35"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient></defs><style>text{font-family:"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif}.name{font-size:24px;font-weight:700;fill:#FFFFFF}.desc{font-size:15px;fill:#BBD3F5}.tag{font-size:12px;font-weight:600;fill:#DCEBFF}.num{font-size:17px;font-weight:800;fill:#5C3D00}.loop{font-size:13px;font-weight:700;fill:#FFE58A}.flow{animation:flow 1.4s linear infinite}.flowG{animation:flow 1.4s linear infinite}.sway{animation:sway 7s ease-in-out infinite}.halo{animation:ping 4s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}.core{animation:heart 2.8s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-36}}@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}@keyframes ping{0%{transform:scale(.9);opacity:.7}28%{transform:scale(1.5);opacity:0}100%{transform:scale(1.5);opacity:0}}@keyframes heart{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g clip-path="url(#clip)"><rect width="1125" height="340" fill="url(#bg)"/><g fill="none" stroke="#7FB2E5" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8" opacity=".9"><path class="flow" d="M222,150 H352" marker-end="url(#ahBlue)"/><path class="flow" d="M497,150 H627" marker-end="url(#ahBlue)"/><path class="flow" d="M772,150 H902" marker-end="url(#ahBlue)"/></g><path class="flowG" d="M700,216 C700,318 425,318 425,220" fill="none" stroke="#FFD75E" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#ahGold)"/><circle r="6" fill="#FFFFFF"><animateMotion dur="4s" repeatCount="indefinite" path="M150,150 H975"/></circle><circle r="5" fill="#FFD75E"><animateMotion dur="4s" begin="2s" repeatCount="indefinite" path="M700,216 C700,318 425,318 425,220"/></circle><g><rect x="252" y="106" width="92" height="26" rx="13" fill="#FFFFFF" fill-opacity=".12" stroke="#9CC8FF" stroke-opacity=".6"/><text class="tag" x="298" y="123" text-anchor="middle">LogicSpec</text><rect x="488" y="106" width="148" height="26" rx="13" fill="#FFFFFF" fill-opacity=".12" stroke="#9CC8FF" stroke-opacity=".6"/><text class="tag" x="562" y="123" text-anchor="middle">Enkrypt guardrails</text><rect x="780" y="106" width="114" height="26" rx="13" fill="#FFFFFF" fill-opacity=".12" stroke="#9CC8FF" stroke-opacity=".6"/><text class="tag" x="837" y="123" text-anchor="middle">exact parity</text></g><rect x="452" y="274" width="216" height="34" rx="17" fill="#13294F"/><rect x="452" y="274" width="216" height="34" rx="17" fill="#FFD75E" fill-opacity=".16" stroke="#FFD75E"/><text class="loop" x="560" y="296" text-anchor="middle">self-heal · up to 3 retries</text><g transform="translate(150,150)"><circle class="halo" r="64" fill="url(#halo)" style="animation-delay:0s"/><g class="sway"><g fill="url(#g1)" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1"><use href="#pet" transform="scale(.95)"/><use href="#pet" transform="rotate(90) scale(.95)"/><use href="#pet" transform="rotate(180) scale(.95)"/><use href="#pet" transform="rotate(270) scale(.95)"/></g></g><circle r="15" fill="url(#core)" stroke="#FFFFFF" stroke-width="1.5"/><text class="num" y="6" text-anchor="middle">1</text></g><text class="name" x="150" y="48" text-anchor="middle">Analyze</text><text class="desc" x="150" y="72" text-anchor="middle">Tree-sitter → LogicSpec</text><g transform="translate(425,150)"><circle class="halo" r="64" fill="url(#halo)" style="animation-delay:1.37s"/><g class="sway" style="animation-delay:-1.5s"><g fill="url(#g2)" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1"><use href="#pet" transform="scale(.95)"/><use href="#pet" transform="rotate(90) scale(.95)"/><use href="#pet" transform="rotate(180) scale(.95)"/><use href="#pet" transform="rotate(270) scale(.95)"/></g></g><circle r="15" fill="url(#core)" stroke="#FFFFFF" stroke-width="1.5"/><text class="num" y="6" text-anchor="middle">2</text></g><text class="name" x="425" y="48" text-anchor="middle">Synthesize</text><text class="desc" x="425" y="72" text-anchor="middle">Local LLM + Moss context</text><g transform="translate(700,150)"><circle class="halo" r="64" fill="url(#halo)" style="animation-delay:2.73s"/><g class="sway" style="animation-delay:-3s"><g fill="url(#g3)" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1"><use href="#pet" transform="scale(.95)"/><use href="#pet" transform="rotate(90) scale(.95)"/><use href="#pet" transform="rotate(180) scale(.95)"/><use href="#pet" transform="rotate(270) scale(.95)"/></g></g><circle r="15" fill="url(#core)" stroke="#FFFFFF" stroke-width="1.5"/><text class="num" y="6" text-anchor="middle">3</text></g><text class="name" x="700" y="48" text-anchor="middle">Verify</text><text class="desc" x="700" y="72" text-anchor="middle">Property tests · Z3 · sandbox</text><g transform="translate(975,150)"><circle class="halo" r="64" fill="url(#halo)" style="animation-delay:0s"/><g class="sway" style="animation-delay:-4.5s"><g fill="url(#g4)" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1"><use href="#pet" transform="scale(.95)"/><use href="#pet" transform="rotate(90) scale(.95)"/><use href="#pet" transform="rotate(180) scale(.95)"/><use href="#pet" transform="rotate(270) scale(.95)"/></g></g><circle r="15" fill="url(#core)" stroke="#FFFFFF" stroke-width="1.5"/><text class="num" y="6" text-anchor="middle">4</text></g><text class="name" x="975" y="48" text-anchor="middle">Parity</text><text class="desc" x="975" y="72" text-anchor="middle">Modern code + parity score</text></g></svg>
