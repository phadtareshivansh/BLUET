<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d"><title id="t">BLUET</title><desc id="d">An animated four-petaled bluet flower blooming beside the BLUET wordmark, with petals drifting through a deep blue sky.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1B3A"/><stop offset="0.55" stop-color="#16346B"/><stop offset="1" stop-color="#2A5DAE"/></linearGradient><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#9CC8FF" stop-opacity="0.55"/><stop offset="1" stop-color="#9CC8FF" stop-opacity="0"/></radialGradient><linearGradient id="petal" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#F2F8FF"/><stop offset="0.45" stop-color="#B4D6FB"/><stop offset="1" stop-color="#6FA8EE"/></linearGradient><radialGradient id="core" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#FFF3B0"/><stop offset="1" stop-color="#F3B21B"/></radialGradient><linearGradient id="word" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#B9D7FF"/></linearGradient><path id="pet" d="M0,-2 C-20,-10 -36,-44 -15,-63 C-9,-68 -3,-63 0,-55 C3,-63 9,-68 15,-63 C36,-44 20,-10 0,-2 Z"/><clipPath id="clip"><rect width="1200" height="380" rx="28"/></clipPath></defs><style>text{font-family:"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif}.intro{animation:intro 2s cubic-bezier(.2,.8,.2,1) both}.sway{animation:sway 9s ease-in-out infinite}.pt{animation:pulse 5s ease-in-out infinite}.heart{animation:heart 2.8s ease-in-out infinite}.glow{animation:glow 5s ease-in-out infinite}.fp{animation:fall 11s linear infinite;opacity:0}.tw{animation:twinkle 3s ease-in-out infinite}.w1{animation:wave 14s linear infinite}.w2{animation:wave 9s linear infinite}.r1{animation:rise 1s .4s cubic-bezier(.2,.8,.2,1) both}.r2{animation:rise 1s .7s cubic-bezier(.2,.8,.2,1) both}.r3{animation:rise 1s 1s cubic-bezier(.2,.8,.2,1) 