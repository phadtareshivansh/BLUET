<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-labelledby="t d"><title id="t">Modernize boldly. Verify everything.</title><desc id="d">A night meadow of swaying bluet flowers with drifting fireflies.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1B3A"/><stop offset="1" stop-color="#1B3E7C"/></linearGradient><linearGradient id="petal" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#F2F8FF"/><stop offset="0.5" stop-color="#B4D6FB"/><stop offset="1" stop-color="#6FA8EE"/></linearGradient><radialGradient id="core" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#FFF3B0"/><stop offset="1" stop-color="#F3B21B"/></radialGradient><linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E8B57"/><stop offset="1" stop-color="#14503A"/></linearGradient><path id="pet" d="M0,-2 C-20,-10 -36,-44 -15,-63 C-9,-68 -3,-63 0,-55 C3,-63 9,-68 15,-63 C36,-44 20,-10 0,-2 Z"/><clipPath id="clip"><rect width="1200" height="230" rx="28"/></clipPath><g id="plant"><path d="M0,0 C-8,-40 8,-80 0,-118" fill="none" stroke="#3E9B62" stroke-width="4" stroke-linecap="round"/><path d="M0,-38 C-26,-50 -40,-40 -44,-28 C-24,-26 -10,-30 0,-38 Z" fill="#4CB374"/><path d="M0,-66 C24,-80 38,-72 42,-60 C22,-56 8,-58 0,-66 Z" fill="#3E9B62"/><g transform="translate(0,-122) scale(.62)"><g fill="url(#petal)" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="1.2"><use href="#pet"/><use href="#pet" transform="rotate(90)"/><use href="#pet" transform="rotate(180)"/><use href="#pet" transform="rotate(270)"/></g><circle r="10" fill="url(#core)" stroke="#FFFFFF" stroke-width="1.5"/></g></g></defs><style>text{font-family:"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif}.sway{animation:sway 6s ease-in-out infinite}.ff{animation:drift 7s ease-in-out infinite,twinkle 2.8s ease-in-out infinite}.tw{animation:twinkle 3s ease-in-out infinite}.in1{animation:rise 1s .2s cubic-bezier(.2,.8,.2,1) both}.in2{animation:rise 1s .5s cubic-bezier(.2,.8,.2,1) both}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes drift{0%,100%{transform:translate(0,0)}25%{transform:translate(14px,-12px)}50%{transform:translate(-6px,-24px)}75%{transform:translate(-16px,-8px)}}@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style><g clip-path="url(#clip)"><rect width="1200" height="230" fill="url(#bg)"/><g fill="#DDEBFF"><circle class="tw" cx="70" cy="40" r="1.8" style="animation-delay:0s"/><circle class="tw" cx="300" cy="28" r="1.6" style="animation-delay:1s"/><circle class="tw" cx="930" cy="34" r="1.8" style="animation-delay:1.8s"/><circle class="tw" cx="1120" cy="60" r="2" style="animation-delay:.6s"/></g><text class="in1" x="600" y="76" text-anchor="middle" font-size="30" font-weight="800" fill="#FFFFFF">Modernize boldly. Verify everything.</text><text class="in2" x="600" y="108" text-anchor="middle" font-size="16" font-weight="600" letter-spacing="1" fill="#9CC8FF">Local-first  ·  Sandboxed  ·  Proven against the original</text><path d="M0,200 C200,188 400,210 600,198 C800,186 1000,210 1200,196 V230 H0Z" fill="url(#ground)"/><g transform="translate(60,206) scale(1)"><g class="sway" style="animation-delay:0s"><use href="#plant"/></g></g><g transform="translate(150,210) scale(.8)"><g class="sway" style="animation-delay:-2s;animation-duration:7s"><use href="#plant"/></g></g><g transform="translate(240,206) scale(1.05)"><g class="sway" style="animation-delay:-4s;animation-duration:5.5s"><use href="#plant"/></g></g><g transform="translate(330,211) scale(.5)"><g class="sway" style="animation-delay:-1s;animation-duration:6.5s"><use href="#plant"/></g></g><g transform="translate(410,209) scale(.42)"><g class="sway" style="animation-delay:-3s"><use href="#plant"/></g></g><g transform="translate(500,211) scale(.38)"><g class="sway" style="animation-delay:-2s;animation-duration:7s"><use href="#plant"/></g></g><g transform="translate(700,211) scale(.38)"><g class="sway" style="animation-delay:-4s;animation-duration:7s"><use href="#plant"/></g></g><g transform="translate(790,209) scale(.42)"><g class="sway" style="animation-delay:-1.5s"><use href="#plant"/></g></g><g transform="translate(870,211) scale(.5)"><g class="sway" style="animation-delay:-3.5s;animation-duration:6.5s"><use href="#plant"/></g></g><g transform="translate(960,206) scale(1.05)"><g class="sway" style="animation-delay:-5s;animation-duration:5.5s"><use href="#plant"/></g></g><g transform="translate(1050,210) scale(.8)"><g class="sway" style="animation-delay:-1.5s;animation-duration:7s"><use href="#plant"/></g></g><g transform="translate(1140,206) scale(1)"><g class="sway" style="animation-delay:-2.5s"><use href="#plant"/></g></g><g fill="#FFE58A"><circle class="ff" cx="140" cy="150" r="3" style="animation-delay:0s"/><circle class="ff" cx="330" cy="120" r="2.6" style="animation-delay:-2s"/><circle class="ff" cx="560" cy="170" r="2.4" style="animation-delay:-4s"/><circle class="ff" cx="650" cy="160" r="2.8" style="animation-delay:-1s"/><circle class="ff" cx="880" cy="125" r="2.6" style="animation-delay:-3s"/><circle class="ff" cx="1080" cy="145" r="3" style="animation-delay:-5s"/></g></g></svg>
